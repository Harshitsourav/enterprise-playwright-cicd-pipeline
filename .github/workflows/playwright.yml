name: Playwright CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Clone the repository onto the runner
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js 20 & cache ~/.npm
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install dependencies from package-lock.json
      - name: 3. Install dependencies
        run: npm ci

      # Step 4: Validate TypeScript compilation (fast fail)
      - name: 4. Static type check
        run: npm run type-check

      # Step 5: Install Playwright's Chromium browser and Linux system packages
      - name: 5. Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Step 6: Execute the automated test suite
      - name: 6. Run Playwright tests
        run: npm run test:chromium
        env:
          CI: true

      # Step 7: Upload test report & artifacts (runs even if tests fail)
      - name: 7. Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
