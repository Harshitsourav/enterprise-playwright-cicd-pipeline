name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from GitHub UI
jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: harshit177sourav/playwright-tests:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    env:
      HOME: /root

    # env:
    #   BASE_URL: "https://www.saucedemo.com"
    #   STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
    #   STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
    #   CI: true

    strategy:
      fail-fast: false # Run all shards even if one fails
      matrix:
        shardIndex: [1, 2] # 2 parallel virtual machines
        shardTotal: [2]

    steps:
      # Step 1: Clone your repository into the VM
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 26
      #     cache: "npm"

      # Step 3: Install exact dependencies deterministically
      - name: Install dependencies
        run: npm ci

      # Step 3a: Check if browsers are already cached from a previous run
      # - name: Cache Playwright Browsers
      #   id: playwright-cache
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      # # Step 3b: ONLY install browsers if there was a CACHE MISS
      # - name: Install Playwright Browsers and OS Deps
      #   if: steps.playwright-cache.outputs.cache-hit != 'true'
      #   run: npx playwright install --with-deps

      # # Step 3c: If cache hit, we ONLY need the OS system libraries
      # - name: Install Playwright OS Deps Only
      #   if: steps.playwright-cache.outputs.cache-hit == 'true'
      #   run: npx playwright install-deps

      # Step 5: Execute tests
      - name: Run Playwright Tests (Shard ${{ matrix.shardIndex}}/${{matrix.shardTotal}})
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}  --reporter=blob

      # Upload blob artifact:
      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
  merge-reports:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge Reports into Unified HTML
        run: npx playwright merge-reports --reporter=html all-blob-reports
      - name: Upload Final Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: final-playwright-report
          path: playwright-report/
          retention-days: 14
